name: Build GBA ROM
on:
  push:
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test story progression and map accessibility
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c tests/story_test.c -o /tmp/danny_story_test
          /tmp/danny_story_test
      - name: Test both render modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c tests/render_test.c -o /tmp/danny_render_test
          /tmp/danny_render_test
      - name: Test numbered-day neutral finale and the good epilogue
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c tests/ending_test.c -o /tmp/danny_ending_test
          /tmp/danny_ending_test
      - name: Test before, during and after server encounters
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c tests/cult_test.c -o /tmp/danny_cult_test
          /tmp/danny_cult_test

  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Publish playable ROM to main (no artifact quota needed)
        run: |
          cd "$GITHUB_WORKSPACE"
          printf 'Publish workspace: '; pwd
          ls -ld .git || true
          git rev-parse --show-toplevel || true
          mkdir -p dist
          cp danny_steel_title.gba dist/danny_steel_title.gba
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -f dist/danny_steel_title.gba
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "build: refresh playable Danny Steel GBA ROM [skip ci]"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:main
          fi
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: "*.gba"
