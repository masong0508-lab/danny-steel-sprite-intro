name: Build GBA ROM
on:
  push:
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test story progression and map accessibility
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c tests/story_test.c -o /tmp/danny_story_test
          /tmp/danny_story_test
      - name: Test both render modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c tests/render_test.c -o /tmp/danny_render_test
          /tmp/danny_render_test

  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Publish playable ROM to main (no artifact quota needed)
        run: |
          mkdir -p dist
          cp danny_steel_title.gba dist/danny_steel_title.gba
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/danny_steel_title.gba
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh playable Danny Steel GBA ROM [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: "*.gba"
