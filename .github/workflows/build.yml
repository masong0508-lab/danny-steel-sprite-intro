      - name: Validate full Potheads dance, floor contacts, source crop and captions
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/cinema.c src/hd_canvas.c \
            src/hd_cinema.c src/hd_actor.c src/hd_special.c \
            src/hd_ending.c src/hd_overlay.c tests/potheads_open_test.c \
            -o /tmp/danny_potheads_open
