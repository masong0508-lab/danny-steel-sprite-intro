name: Build GBA ROM
on:
  push:
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest source revision may publish the ROM back to main.
# Older builds are cancelled before they can race and push stale binaries.
concurrency:
  group: danny-steel-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate safe intentional hold-to-erase save interaction
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/menu_ink.c tests/menu_ink_test.c -o /tmp/danny_menu_ink_test
          /tmp/danny_menu_ink_test
      - name: Verify real menu key-repeat, START activation and A-only save erasure
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/menu_ink.c tests/menu_nav_test.c -o /tmp/danny_menu_nav
          /tmp/danny_menu_nav
      - name: Verify megabyte expansion, branching stories, journal and saves
        run: |
          node tools/build_neighborhood_panels.js /tmp/danny-neighborhood
          for f in assets/neighborhood/*.bin; do cmp "$f" "/tmp/danny-neighborhood/$(basename "$f")"; done
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_cinema.c \
            src/hd_actor.c src/hd_special.c src/hd_overlay.c \
            tests/neighborhood_test.c -o /tmp/danny_neighborhood
          /tmp/danny_neighborhood
      - name: Validate native 240x160 title, city, dialogue and double-buffer-compatible upscale
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/hd_canvas.c src/hd_menu.c src/hd_world.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c src/hd_world_atlas.c src/hd_overlay.c src/menu_ink.c tests/hd_graphics_test.c -o /tmp/danny_native_graphics_test
          /tmp/danny_native_graphics_test
      - name: Verify ROM-authored town tiles, eight-way walking art, all NPCs and perspective matching
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world.c \
            src/hd_world_atlas.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c \
            tests/hd_world_atlas_test.c \
            -o /tmp/danny_world_atlas_test
          /tmp/danny_world_atlas_test
      - name: Verify state-driven town landmarks, Mara casting and creative work art
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world_atlas.c \
            src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c \
            src/hd_perspective.c tests/hd_landmarks_test.c -o /tmp/danny_landmarks
          /tmp/danny_landmarks
      - name: Validate native isometric walkability, occlusion, pixels, weather and town locations
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c \
            src/hd_world.c src/hd_world_atlas.c src/hd_isometric.c \
            src/hd_isometric_atlas.c src/hd_facade_art.c tests/hd_isometric_test.c \
            -o /tmp/danny_hd_isometric
          /tmp/danny_hd_isometric
      - name: Validate eight authored building fronts, clipping and Danny's updated opening priorities
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c \
            src/hd_isometric_atlas.c src/hd_facade_art.c \
            tests/hd_facade_art_test.c -o /tmp/danny_facades
          /tmp/danny_facades
      - name: Validate native cartridge-backdrop combat, authentic attacks and portrait safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_actor.c \
            src/hd_arena.c src/hd_arena_art.c tests/hd_arena_test.c \
            -o /tmp/danny_native_arena
          /tmp/danny_native_arena
      - name: Validate native perspective, six-tab studio, story scenes and pixel safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world.c \
            src/hd_world_atlas.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c src/hd_perspective.c src/hd_cinema.c src/hd_studio.c \
            src/hd_actor.c src/hd_special.c src/hd_overlay.c \
            tests/hd_nextgen_test.c -o /tmp/danny_hd_nextgen
          /tmp/danny_hd_nextgen
      - name: Verify shared district textures and continuous camera geometry
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_facade_art.c \
            tests/scene_geometry_test.c -o /tmp/danny_scene_geometry
          /tmp/danny_scene_geometry
      - name: Verify optimized first-person pixels and exact floor occlusion
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world_atlas.c \
            src/hd_facade_art.c src/hd_perspective.c \
            tests/hd_perspective_equivalence_test.c -o /tmp/danny_perspective_equivalence
          /tmp/danny_perspective_equivalence
      - name: Verify full-source motion provenance, crop safety and reproducible ROM data
        run: |
          python3 tests/potheads_trace_pack_test.py
          python3 tools/build_potheads_trace.py tools/references/potheads_trace.json /tmp/potheads_motion.h
          cmp src/potheads_motion.h /tmp/potheads_motion.h
      - name: Verify immutable storefront stream against the live projected camera
        run: |
          python3 tools/build_potheads_set.py /tmp/hd_potheads_fixed.h
          cmp src/hd_potheads_fixed.h /tmp/hd_potheads_fixed.h
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/hd_canvas.c tests/potheads_set_test.c -o /tmp/danny_potheads_set
          /tmp/danny_potheads_set
      - name: Verify bounded body interpolation and measured sign tip transitions
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tests/potheads_continuity_test.c -o /tmp/danny_motion_continuity
          /tmp/danny_motion_continuity
      - name: Verify every sign silhouette, measured arrow tip and grip bounds
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Isrc src/hd_canvas.c tests/potheads_sign_geometry_test.c -o /tmp/danny_sign_geometry
          /tmp/danny_sign_geometry
      - name: Verify sign raster and connected body joints throughout the source
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Isrc src/hd_canvas.c tests/potheads_sign_body_raster_test.c -o /tmp/danny_sign_body_raster
