          /tmp/danny_ending_montage_test

  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build cartridge and record the exact ARM compiler
        run: |
          if ! command -v cc >/dev/null || ! test -f /usr/include/lz4hc.h; then
            apt-get update -qq && apt-get install -y -qq gcc libc6-dev liblz4-dev
          fi
          "${DEVKITARM:-/opt/devkitpro/devkitARM}/bin/arm-none-eabi-gcc" --version
          make
          sha256sum danny_steel_title.gba
      - name: Enforce static RAM headroom and report real linked memory use
        run: |
          # GNU ld provides the exact section sizes. The devkitARM container
          # does not ship arm-none-eabi-size in every revision.
          map=danny_steel_title.map
          test -s "$map"
          ewram_hex="$(awk '$1==".ewram" && $2 ~ /^0x02/ {print $3;exit}' "$map")"
          iwram_hex="$(awk '$1==".iwram" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          bss_hex="$(awk '$1==".bss" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          data_hex="$(awk '$1==".data" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          test -n "$ewram_hex" && test -n "$iwram_hex" &&
          test -n "$bss_hex" && test -n "$data_hex"
          ewram=$((ewram_hex))
          iwram=$((iwram_hex))
          bss=$((bss_hex))
          data=$((data_hex))
          static_iwram=$((iwram+bss+data))
          echo "EWRAM static: $ewram bytes (limit 196608 / 262144 physical)"
          echo "IWRAM BSS: $bss; data: $data; explicit IWRAM: $iwram"
          echo "IWRAM static total: $static_iwram bytes (limit 24576 / 32768 physical)"
          test "$ewram" -le 196608
          # Leave at least 8 KiB for the main stack/interrupt headroom.
          test "$static_iwram" -le 24576
          echo "ROM bytes:"
          wc -c danny_steel_title.gba
      - name: Package tested ROM, play instructions and SHA-256 in one ZIP
        run: |
          set -eu
          test -s danny_steel_title.gba
          sha256sum danny_steel_title.gba > SHA256SUMS.txt
          printf '%s\n' \
            'THE LAST DAYS OF DANNY STEEL - Game Boy Advance' \
            'Includes the playable Old Quarter chapter and fourteen optional illustrated neighborhood stories.' \
            'Side stories: finish letter, BORE and Mara; START then SELECT; A tracks a site. A STORY on arrival.' \
            'ROM: danny_steel_title.gba' \
            'Run in mGBA or Pizza Boy GBA, with SRAM saves enabled (32 KB/Auto).' \
            'Title: START. Menu: D-pad (both axes), A or START select, B back.' \
            'Save erase requires a deliberate uninterrupted 40-frame A hold.' \
            'Exploration: D-pad move, A interact, L/SELECT view, R notes, START pause.' \
            "Source commit: $GITHUB_SHA" > ROM-README.txt
          if command -v python3 >/dev/null 2>&1; then
            python3 -c "from zipfile import ZipFile,ZIP_DEFLATED; z=ZipFile('Danny-Steel-GBA-Playable.zip','w',ZIP_DEFLATED,compresslevel=9); [z.write(n) for n in ('danny_steel_title.gba','ROM-README.txt','SHA256SUMS.txt')]; z.close()"
          elif command -v zip >/dev/null 2>&1; then
            zip -9 -q Danny-Steel-GBA-Playable.zip danny_steel_title.gba ROM-README.txt SHA256SUMS.txt
          else
            echo 'No ZIP tool in devkitARM build container' >&2
            exit 1
          fi
          test -s Danny-Steel-GBA-Playable.zip
          wc -c Danny-Steel-GBA-Playable.zip
      - name: Publish playable ROM and ZIP to main (no artifact quota needed)
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf 'Publish workspace: '; pwd
          git rev-parse --show-toplevel
          mkdir -p dist
          # Preserve the verified binary outside the working tree while
          # switching onto main. A tracked older ROM would otherwise
          # block checkout with "local changes would be overwritten".
          cp danny_steel_title.gba /tmp/danny_verified_rom.gba
          cp Danny-Steel-GBA-Playable.zip /tmp/danny_verified_package.zip
          if git ls-files --error-unmatch dist/danny_steel_title.gba >/dev/null 2>&1; then
            git restore --source=HEAD --staged --worktree -- dist/danny_steel_title.gba
          else
            rm -f dist/danny_steel_title.gba
          fi
          if git ls-files --error-unmatch dist/Danny-Steel-GBA-Playable.zip >/dev/null 2>&1; then
            git restore --source=HEAD --staged --worktree -- dist/Danny-Steel-GBA-Playable.zip
          else
            rm -f dist/Danny-Steel-GBA-Playable.zip
          fi
          # Screenshot CI can legitimately advance main after this run
          # starts. Its image-only commit is safe to publish a ROM on top
          # of; ANY source/workflow/tool change is not. Compare trees,
          # not commit IDs, before moving the publisher to latest main.
          git -C "$GITHUB_WORKSPACE" fetch --quiet origin main
          current_main="$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            unsafe="$(git diff --name-only "$GITHUB_SHA" "$current_main" | grep -Ev '^(docs/screenshots/|dist/danny_steel_title[.]gba$|dist/Danny-Steel-GBA-Playable[.]zip$)' || true)"
            if [ -n "$unsafe" ]; then
              echo "Skipping stale ROM; non-screenshot sources changed:"
              printf '%s\n' "$unsafe"
              exit 0
            fi
          fi
          git -C "$GITHUB_WORKSPACE" checkout -q -B rom-publisher "$current_main"
          cp /tmp/danny_verified_rom.gba dist/danny_steel_title.gba
          cp /tmp/danny_verified_package.zip dist/Danny-Steel-GBA-Playable.zip
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -f dist/danny_steel_title.gba dist/Danny-Steel-GBA-Playable.zip
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "build: refresh playable Danny Steel GBA ROM [skip ci]"
            if ! git -C "$GITHUB_WORKSPACE" push origin HEAD:main; then
              # A screenshot commit may have arrived during the push.
              git -C "$GITHUB_WORKSPACE" fetch --quiet origin main
              current_main="$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)"
              unsafe="$(git diff --name-only "$GITHUB_SHA" "$current_main" | grep -Ev '^(docs/screenshots/|dist/danny_steel_title[.]gba$|dist/Danny-Steel-GBA-Playable[.]zip$)' || true)"
              if [ -n "$unsafe" ]; then
                echo "Refusing to rebase stale ROM over newer source changes"
                exit 0
              fi
              git -C "$GITHUB_WORKSPACE" rebase "$current_main"
              git -C "$GITHUB_WORKSPACE" push origin HEAD:main
            fi
          fi
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: |
            *.gba
            *.zip

