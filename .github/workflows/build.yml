name: Build GBA ROM
on:
  push:
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest source revision may publish the ROM back to main.
# Older builds are cancelled before they can race and push stale binaries.
concurrency:
  group: danny-steel-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test story progression and map accessibility
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c tests/story_test.c -o /tmp/danny_story_test
          /tmp/danny_story_test
      - name: Test both render modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/render_test.c -o /tmp/danny_render_test
          /tmp/danny_render_test
      - name: Verify objective guidance across both camera modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/objective_test.c -o /tmp/danny_objective_test
          /tmp/danny_objective_test
      - name: Test five optional day activities, changing scenes and clinic access
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/daily_moments_test.c -o /tmp/danny_daily_moments_test
          /tmp/danny_daily_moments_test
      - name: Test daily choices, resources, cancellation and accessible doctor visits
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/life_choices_test.c -o /tmp/danny_life_choices_test
          /tmp/danny_life_choices_test
      - name: Test two persistent creative projects and time-of-day dialogue
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/projects_test.c -o /tmp/danny_projects_test
          /tmp/danny_projects_test
      - name: Validate all SRAM v1-v5 migrations, checksum and slot bounds
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story_save.c tests/save_codec_test.c -o /tmp/danny_save_codec_test
          /tmp/danny_save_codec_test
      - name: Test live consequence checklist, accessible journal UI and reactive rescue scenes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/consequence_journal_test.c -o /tmp/danny_consequences_test
          /tmp/danny_consequences_test
      - name: Check Mara kidnapping, rescue, both bad-ending outcomes and restored good/neutral routes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/rescue_route_test.c -o /tmp/danny_rescue_route_test
          /tmp/danny_rescue_route_test
      - name: Verify safe, checksummed per-slot Mara rescue persistence
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/rescue_save.c tests/rescue_save_test.c -o /tmp/danny_rescue_save_test
          /tmp/danny_rescue_save_test
      - name: Test numbered-day neutral finale and the good epilogue
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/ending_test.c -o /tmp/danny_ending_test
          /tmp/danny_ending_test
      - name: Test before, during and after server encounters
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/cult_test.c -o /tmp/danny_cult_test
          /tmp/danny_cult_test

      - name: Verify cinematic shot coverage and animation safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/cinema_test.c -o /tmp/danny_cinema_test
          /tmp/danny_cinema_test

      - name: Validate BORE-derived melodic motifs and note ranges
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/music_motifs.c tests/music_motifs_test.c -o /tmp/danny_motifs_test
          /tmp/danny_motifs_test
      - name: Check timer-based PSG music engine
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/stubs -Isrc -DHOST_MUSIC_TEST -include tests/stubs/gba.h src/music.c src/music_motifs.c tests/music_engine_test.c -o /tmp/danny_music_engine_test
          /tmp/danny_music_engine_test
      - name: Check full Here Today score in three endings and good coda
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/stubs -Isrc -DHOST_MUSIC_TEST -include tests/stubs/gba.h src/music.c src/music_motifs.c tests/music_ending_test.c -o /tmp/danny_music_ending_test
          /tmp/danny_music_ending_test

      - name: Verify 72-second film, 16-second coda and frame bounds
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c src/cinema.c tests/ending_montage_test.c -o /tmp/danny_ending_montage_test
          /tmp/danny_ending_montage_test

  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Publish playable ROM to main (no artifact quota needed)
        run: |
          cd "$GITHUB_WORKSPACE"
          printf 'Publish workspace: '; pwd
          ls -ld .git || true
          git rev-parse --show-toplevel || true
          mkdir -p dist
          cp danny_steel_title.gba dist/danny_steel_title.gba
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Build output from an outdated checkout must never overwrite the
          # latest game's ROM. A new push triggers its own current build.
          git -C "$GITHUB_WORKSPACE" fetch --quiet origin main
          current_main="$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipping stale ROM: main advanced while this revision built"
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -f dist/danny_steel_title.gba
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "build: refresh playable Danny Steel GBA ROM [skip ci]"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:main
          fi
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: "*.gba"
