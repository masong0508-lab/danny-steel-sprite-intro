name: Build GBA ROM
on:
  push:
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest source revision may publish the ROM back to main.
# Older builds are cancelled before they can race and push stale binaries.
concurrency:
  group: danny-steel-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate safe intentional hold-to-erase save interaction
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/menu_ink.c tests/menu_ink_test.c -o /tmp/danny_menu_ink_test
          /tmp/danny_menu_ink_test
      - name: Validate native 240x160 title, city, dialogue and double-buffer-compatible upscale
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/hd_canvas.c src/hd_menu.c src/hd_world.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c src/hd_world_atlas.c src/hd_overlay.c src/menu_ink.c tests/hd_graphics_test.c -o /tmp/danny_native_graphics_test
          /tmp/danny_native_graphics_test
      - name: Verify ROM-authored town tiles, eight-way walking art, all NPCs and perspective matching
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world.c \
            src/hd_world_atlas.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c \
            tests/hd_world_atlas_test.c \
            -o /tmp/danny_world_atlas_test
          /tmp/danny_world_atlas_test
      - name: Validate native isometric walkability, occlusion, pixels, weather and town locations
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c \
            src/hd_world.c src/hd_world_atlas.c src/hd_isometric.c \
            src/hd_isometric_atlas.c src/hd_facade_art.c tests/hd_isometric_test.c \
            -o /tmp/danny_hd_isometric
          /tmp/danny_hd_isometric
      - name: Validate eight authored building fronts, clipping and Danny's updated opening priorities
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c \
            src/hd_isometric_atlas.c src/hd_facade_art.c \
            tests/hd_facade_art_test.c -o /tmp/danny_facades
          /tmp/danny_facades
      - name: Validate native cartridge-backdrop combat, authentic attacks and portrait safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_actor.c \
            src/hd_arena.c src/hd_arena_art.c tests/hd_arena_test.c \
            -o /tmp/danny_native_arena
          /tmp/danny_native_arena
      - name: Validate native perspective, six-tab studio, story scenes and pixel safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c src/hd_world.c \
            src/hd_world_atlas.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c src/hd_perspective.c src/hd_cinema.c src/hd_studio.c \
            src/hd_actor.c src/hd_special.c src/hd_overlay.c \
            tests/hd_nextgen_test.c -o /tmp/danny_hd_nextgen
          /tmp/danny_hd_nextgen
      - name: Validate reference-ready Potheads opening, sign and all dance beats
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/cinema.c src/hd_canvas.c \
            src/hd_cinema.c src/hd_actor.c src/hd_special.c \
            src/hd_ending.c src/hd_overlay.c tests/potheads_open_test.c \
            -o /tmp/danny_potheads_open
          /tmp/danny_potheads_open
      - name: Validate every native cinema and three rescue-aware score-length endings
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/cinema.c src/hd_canvas.c \
            src/hd_cinema.c src/hd_actor.c src/hd_special.c \
            src/hd_ending.c tests/hd_story_expansion_test.c \
            -o /tmp/danny_hd_story_expansion
          /tmp/danny_hd_story_expansion
      - name: Prove pixel-identical geometry, town coordinates and exact wall-projection rounding
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/hd_canvas.c \
            tests/native_perf_equivalence_test.c -o /tmp/danny_perf_equivalence
          /tmp/danny_perf_equivalence
      - name: Profile per-scene host render costs without confusing them with GBA FPS
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/cinema.c src/hd_canvas.c \
            src/hd_world.c src/hd_world_atlas.c src/hd_isometric.c src/hd_isometric_atlas.c src/hd_facade_art.c src/hd_perspective.c src/hd_studio.c \
            src/hd_cinema.c src/hd_actor.c src/hd_special.c \
            src/hd_ending.c src/hd_arena.c src/hd_arena_art.c \
            tests/render_cost_probe.c -o /tmp/danny_render_cost
          /tmp/danny_render_cost
      - name: Test story progression and map accessibility
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c tests/story_test.c -o /tmp/danny_story_test
          /tmp/danny_story_test
      - name: Test both render modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/render_test.c -o /tmp/danny_render_test
          /tmp/danny_render_test
      - name: Verify objective guidance across both camera modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/objective_test.c -o /tmp/danny_objective_test
          /tmp/danny_objective_test
      - name: Test five optional day activities, changing scenes and clinic access
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/daily_moments_test.c -o /tmp/danny_daily_moments_test
          /tmp/danny_daily_moments_test
      - name: Test daily choices, resources, cancellation and accessible doctor visits
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/life_choices_test.c -o /tmp/danny_life_choices_test
          /tmp/danny_life_choices_test
      - name: Test two persistent creative projects and time-of-day dialogue
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/projects_test.c -o /tmp/danny_projects_test
          /tmp/danny_projects_test
      - name: Test unlockable six-tab advanced editor, player intuition and per-slot studio save
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/studio_editor_test.c -o /tmp/danny_studio_editor_test
          /tmp/danny_studio_editor_test
      - name: Test actual GBA PSG playback of edited music without interrupting ending score
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/stubs -Isrc -DHOST_MUSIC_TEST -include tests/stubs/gba.h src/music.c src/studio.c src/music_motifs.c tests/studio_audio_test.c -o /tmp/danny_studio_audio_test
          /tmp/danny_studio_audio_test
      - name: Validate all SRAM v1-v5 migrations, checksum and slot bounds
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story_save.c tests/save_codec_test.c -o /tmp/danny_save_codec_test
          /tmp/danny_save_codec_test
      - name: Test live consequence checklist, accessible journal UI and reactive rescue scenes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/consequence_journal_test.c -o /tmp/danny_consequences_test
          /tmp/danny_consequences_test
      - name: Check Mara kidnapping, rescue, both bad-ending outcomes and restored good/neutral routes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/rescue_route_test.c -o /tmp/danny_rescue_route_test
          /tmp/danny_rescue_route_test
      - name: Audit plot continuity, music master, honest promises and conditional endings
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/story_continuity_test.c -o /tmp/danny_story_continuity_test
          /tmp/danny_story_continuity_test
      - name: Test Mara's hopeful unanswered phone, delayed realization and two-day save continuity
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c src/story_save.c src/rescue_save.c tests/hope_phone_test.c -o /tmp/danny_hope_phone_test
          /tmp/danny_hope_phone_test
      - name: Verify safe, checksummed per-slot Mara rescue persistence
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/rescue_save.c tests/rescue_save_test.c -o /tmp/danny_rescue_save_test
          /tmp/danny_rescue_save_test
      - name: Test numbered-day neutral finale and the good epilogue
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/ending_test.c -o /tmp/danny_ending_test
          /tmp/danny_ending_test
      - name: Test before, during and after server encounters
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/cult_test.c -o /tmp/danny_cult_test
          /tmp/danny_cult_test

      - name: Verify cinematic shot coverage and animation safety
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/cinema_test.c -o /tmp/danny_cinema_test
          /tmp/danny_cinema_test

      - name: Check seamless cinematic parallax, tape motion and no-teleport bus arrival
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/cinema.c tests/cinema_temporal_test.c -o /tmp/danny_cinema_temporal_test
          /tmp/danny_cinema_temporal_test
      - name: Check distinct musical storyboard beats across all three endings
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/cinema.c tests/ending_storyboard_test.c -o /tmp/danny_ending_storyboard_test
          /tmp/danny_ending_storyboard_test
      - name: Verify emotional acting and uninterrupted world clock across cinematic cuts
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/cinema.c tests/cinema_acting_clock_test.c -o /tmp/danny_cinema_acting_clock_test
          /tmp/danny_cinema_acting_clock_test
      - name: Validate staged cutscene movement, spatial coherence and route-specific ending shots
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/cinema_direction_test.c -o /tmp/danny_cinema_direction_test
          /tmp/danny_cinema_direction_test
      - name: Validate BORE-derived melodic motifs and note ranges
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/music_motifs.c tests/music_motifs_test.c -o /tmp/danny_motifs_test
          /tmp/danny_motifs_test
      - name: Check timer-based PSG music engine
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/stubs -Isrc -DHOST_MUSIC_TEST -include tests/stubs/gba.h src/music.c src/studio.c src/music_motifs.c tests/music_engine_test.c -o /tmp/danny_music_engine_test
          /tmp/danny_music_engine_test
      - name: Check full Here Today score in three endings and good coda
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/stubs -Isrc -DHOST_MUSIC_TEST -include tests/stubs/gba.h src/music.c src/studio.c src/music_motifs.c tests/music_ending_test.c -o /tmp/danny_music_ending_test
          /tmp/danny_music_ending_test

      - name: Verify 72-second film, 16-second coda and frame bounds
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/studio.c src/story_draw.c src/cinema.c tests/ending_montage_test.c -o /tmp/danny_ending_montage_test
          /tmp/danny_ending_montage_test

  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Enforce static RAM headroom and report real linked memory use
        run: |
          # GNU ld provides the exact section sizes. The devkitARM container
          # does not ship arm-none-eabi-size in every revision.
          map=danny_steel_title.map
          test -s "$map"
          ewram_hex="$(awk '$1==".ewram" && $2 ~ /^0x02/ {print $3;exit}' "$map")"
          iwram_hex="$(awk '$1==".iwram" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          bss_hex="$(awk '$1==".bss" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          data_hex="$(awk '$1==".data" && $2 ~ /^0x03/ {print $3;exit}' "$map")"
          test -n "$ewram_hex" && test -n "$iwram_hex" &&
          test -n "$bss_hex" && test -n "$data_hex"
          ewram=$((ewram_hex))
          iwram=$((iwram_hex))
          bss=$((bss_hex))
          data=$((data_hex))
          static_iwram=$((iwram+bss+data))
          echo "EWRAM static: $ewram bytes (limit 196608 / 262144 physical)"
          echo "IWRAM BSS: $bss; data: $data; explicit IWRAM: $iwram"
          echo "IWRAM static total: $static_iwram bytes (limit 24576 / 32768 physical)"
          test "$ewram" -le 196608
          # Leave at least 8 KiB for the main stack/interrupt headroom.
          test "$static_iwram" -le 24576
          echo "ROM bytes:"
          wc -c danny_steel_title.gba
      - name: Publish playable ROM to main (no artifact quota needed)
        run: |
          cd "$GITHUB_WORKSPACE"
          printf 'Publish workspace: '; pwd
          ls -ld .git || true
          git rev-parse --show-toplevel || true
          mkdir -p dist
          cp danny_steel_title.gba dist/danny_steel_title.gba
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Screenshot CI can legitimately advance main after this run
          # starts. Its image-only commit is safe to publish a ROM on top
          # of; ANY source/workflow/tool change is not. Compare trees,
          # not commit IDs, before moving the publisher to latest main.
          git -C "$GITHUB_WORKSPACE" fetch --quiet origin main
          current_main="$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            unsafe="$(git diff --name-only "$GITHUB_SHA" "$current_main" | grep -Ev '^(docs/screenshots/|dist/danny_steel_title[.]gba$)' || true)"
            if [ -n "$unsafe" ]; then
              echo "Skipping stale ROM; non-screenshot sources changed:"
              printf '%s\n' "$unsafe"
              exit 0
            fi
          fi
          git -C "$GITHUB_WORKSPACE" checkout -q -B rom-publisher "$current_main"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -f dist/danny_steel_title.gba
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "build: refresh playable Danny Steel GBA ROM [skip ci]"
            if ! git -C "$GITHUB_WORKSPACE" push origin HEAD:main; then
              # A screenshot commit may have arrived during the push.
              git -C "$GITHUB_WORKSPACE" fetch --quiet origin main
              current_main="$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)"
              unsafe="$(git diff --name-only "$GITHUB_SHA" "$current_main" | grep -Ev '^(docs/screenshots/|dist/danny_steel_title[.]gba$)' || true)"
              if [ -n "$unsafe" ]; then
                echo "Refusing to rebase stale ROM over newer source changes"
                exit 0
              fi
              git -C "$GITHUB_WORKSPACE" rebase "$current_main"
              git -C "$GITHUB_WORKSPACE" push origin HEAD:main
            fi
          fi
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: "*.gba"
