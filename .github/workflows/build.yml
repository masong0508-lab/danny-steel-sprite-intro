name: Build GBA ROM
on: [push, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test story progression and map accessibility
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c tests/story_test.c -o /tmp/danny_story_test
          /tmp/danny_story_test
      - name: Test both render modes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc src/story.c src/story_draw.c tests/render_test.c -o /tmp/danny_render_test
          /tmp/danny_render_test
  build:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: danny_steel_title
          path: "*.gba"
