name: Potheads source rotoscope regression
on:
  push:
    paths: ["src/potheads_motion.h","src/potheads_drape.h","src/potheads_leg_render.h","src/potheads_upper_render.h","src/potheads_cloth_render.h","src/hd_potheads_actor.h","src/potheads_sign_geometry.h","src/potheads_sign_render.h","src/potheads_continuity.h","src/potheads_shape.h","tools/references/potheads_trace.json","tools/build_potheads_trace.py","tests/potheads*.c","tests/potheads_trace_pack_test.py",".github/workflows/rotoscope.yml"]
  workflow_dispatch:
jobs:
  rotoscope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check measured source coverage and deterministic ROM packing
        run: |
          python3 tests/potheads_trace_pack_test.py
          python3 tools/build_potheads_trace.py tools/references/potheads_trace.json /tmp/potheads_motion.h
          cmp src/potheads_motion.h /tmp/potheads_motion.h
      - name: Check source-only costume projection and safe fallback
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -Isrc tests/potheads_cloth_render_test.c -o /tmp/potheads_cloth
          /tmp/potheads_cloth
      - name: Check continuous costume gravity transition
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -Isrc tests/potheads_drape_test.c -o /tmp/potheads_drape
          /tmp/potheads_drape
      - name: Verify lower-body source-matte decoder and source-only fallback
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc tests/potheads_leg_render_test.c -o /tmp/potheads_leg
          /tmp/potheads_leg
      - name: Verify upper-body rectangle decoder and source-only fallback
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc tests/potheads_upper_render_test.c -o /tmp/potheads_upper
          /tmp/potheads_upper
      - name: Verify actual sign projection, texture and body contours
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Isrc src/hd_canvas.c tests/potheads_sign_geometry_test.c -o /tmp/danny_sign_geometry
          /tmp/danny_sign_geometry
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Isrc src/hd_canvas.c tests/potheads_sign_body_raster_test.c -o /tmp/danny_sign_body_raster
          /tmp/danny_sign_body_raster
      - name: Exercise every tick of the production cutscene painter
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            src/story.c src/studio.c src/cinema.c src/hd_canvas.c \
            src/hd_cinema.c src/hd_actor.c src/hd_special.c \
            src/hd_ending.c src/hd_overlay.c tests/potheads_open_test.c \
            -o /tmp/danny_potheads_open
          /tmp/danny_potheads_open
